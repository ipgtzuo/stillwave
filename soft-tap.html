<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>叩音 · 一池水，一句曲</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  :root {
    --fg: 213,222,216;
    --panel: 9,13,14;
    --line: 160,190,180;
    --accent: 150,196,176;
    --glow: 190,216,204;
    --vig: 1,2,3;
    --vig-a: .60;
  }
  body.paper {
    --fg: 46,52,46;
    --panel: 236,232,222;
    --line: 84,96,80;
    --accent: 62,104,82;
    --glow: 52,86,66;
    --vig: 96,88,70;
    --vig-a: .26;
  }
  body {
    margin: 0; background: #050709; color: rgba(var(--fg), .92);
    font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 1.1s ease, color 1.1s ease;
  }
  .stage { position: relative; width: 100vw; height: 100vh; user-select: none; -webkit-user-select: none; touch-action: none; cursor: crosshair; }
  #water, #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ink { z-index: 1; }
  .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, rgba(var(--line),.025) 0%, rgba(0,0,0,0) 56%, rgba(var(--vig),var(--vig-a)) 100%); transition: background 1.1s ease; }
  /* 安全区变量：浏览器里 env() 恒为 0；包进 iOS App 后原生还会按刘海/底部横条
     注入实际值覆盖它（写在 documentElement 的行内样式优先级更高）。
     写成 env() 而不是 0px，是为了「原生尚未注入」时也天然正确 —— 例如 App 被
     系统回收后 WebView 重新加载，这时标题就不会顶进灵动岛。 */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  .header { position: absolute; z-index: 3; top: calc(30px + var(--sat)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .title { font-size: 14px; letter-spacing: 12px; color: rgba(var(--fg), .3); margin: 0 0 16px 12px; font-weight: 400; }
  /* 总敲击次数：跟着标题走，极淡；敲一下短暂亮起，不抢水面 */
  .title .tally { display: inline-block; letter-spacing: 1px; font-size: 10px; font-weight: 400; font-family: -apple-system, "PingFang SC", sans-serif; font-variant-numeric: tabular-nums; color: rgba(var(--fg), .26); vertical-align: 1px; transition: color 1.1s ease, text-shadow 1.1s ease; }
  .title .tally i { font-style: normal; margin-right: 7px; opacity: .7; }
  .title .tally.pulse { color: rgba(var(--fg), .82); text-shadow: 0 0 12px rgba(var(--glow), .6); }
  .notes { display: flex; justify-content: center; gap: 30px; }
  .notes span { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 13px; letter-spacing: 3px; color: rgba(var(--fg), .2); transition: color 1.2s ease, text-shadow 1.2s ease, transform 1.2s ease; }
  .notes canvas { width: 20px; height: 20px; opacity: .16; transition: opacity 1.2s ease; }
  .notes span.on { color: rgba(var(--fg), .92); text-shadow: 0 0 20px rgba(var(--glow), .5); transform: translateY(-2px); }
  .notes span.on canvas { opacity: .9; }
  .notes span.echo { color: rgba(var(--fg), .45); text-shadow: 0 0 12px rgba(var(--glow), .3); }
  .notes span.echo canvas { opacity: .4; }
  .notes .bar { position: relative; display: block; width: 4px; height: 24px; border-radius: 2px; background: rgba(var(--fg), .075); overflow: hidden; }
  .notes .bar > b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 2px; background: linear-gradient(to top, rgba(var(--accent), .35), rgba(var(--accent), .9)); transition: height .8s cubic-bezier(.16,.7,.3,1), box-shadow .5s ease; }
  .notes .bar > b.cold { background: linear-gradient(to top, rgba(110,150,190,.38), rgba(138,182,212,.9)); }
  .notes .bar > b.flash { box-shadow: 0 0 9px rgba(var(--accent), .75); }
  .notes em { font-style: normal; font-size: 9px; letter-spacing: 0; opacity: 0; font-family: -apple-system, sans-serif; font-variant-numeric: tabular-nums; transition: opacity .8s ease; }
  #melody { display: block; width: 250px; height: 26px; margin: 10px auto 0; }
  .motto { font-size: 10px; letter-spacing: 4px; opacity: .2; margin-top: 4px; }
  .footer { position: absolute; z-index: 3; bottom: calc(30px + var(--sab)); left: 108px; right: 108px; text-align: center; pointer-events: none; }
  .footer .hint { font-size: 12px; letter-spacing: 5px; opacity: .3; transition: opacity 1.4s ease; }
  .footer .sub { font-size: 10px; letter-spacing: 1px; line-height: 1.7; opacity: .18; margin-top: 10px; font-family: -apple-system, sans-serif; }
  .corner { position: absolute; z-index: 3; bottom: calc(32px + var(--sab)); font-size: 11px; letter-spacing: 2px; opacity: .22; font-family: -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
  .corner.left { left: 30px; pointer-events: auto; cursor: pointer; transition: opacity .4s; }
  .corner.left:hover { opacity: .75; }
  .corner.right { right: 30px; pointer-events: auto; cursor: pointer; opacity: .32; transition: opacity .4s; }
  .corner.right:hover { opacity: .85; }
  .corner.right .sep { font-style: normal; opacity: .55; }
  /* 「调 · 澄明」的后半段是可点热点，与左下「景 · 墨池」同一套模式 */
  #tuneMood { display: inline-block; padding-bottom: 1px; border-bottom: 1px dotted rgba(var(--fg), .3); transition: border-color .35s ease; }
  #tuneBtn:hover #tuneMood { border-color: rgba(var(--fg), .8); }
  .panel { position: absolute; z-index: 4; right: 28px; bottom: calc(66px + var(--sab)); width: 276px; max-height: calc(100vh - 96px); overflow-y: auto; padding: 20px 18px 16px; background: rgba(var(--panel), .94); border: 1px solid rgba(var(--line), .14); border-radius: 14px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .55s ease, transform .55s cubic-bezier(.16,.7,.3,1); }
  .panel.show { opacity: 1; transform: none; pointer-events: auto; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 5px; font-weight: 400; opacity: .52; }
  .panel h2:not(:first-child) { margin-top: 20px; }
  .panel h2 small { font-size: 9px; letter-spacing: 1px; opacity: .6; margin-left: 8px; font-family: -apple-system, sans-serif; }
  .chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip { flex: 1 1 42%; padding: 8px 2px; border-radius: 7px; border: 1px solid rgba(var(--line), .18); background: transparent; color: rgba(var(--fg), .62); font-size: 11px; letter-spacing: 1px; cursor: pointer; font-family: inherit; transition: all .35s; }
  .chips.small .chip { flex: 1 1 17%; padding: 7px 1px; font-size: 10px; letter-spacing: 0; }
  .chip.on { border-color: rgba(var(--glow), .55); color: rgba(var(--fg), .95); background: rgba(var(--accent), .1); }
  .legend { font-size: 9px; letter-spacing: 1px; opacity: .34; margin: 0 0 6px; font-family: -apple-system, sans-serif; line-height: 1.5; }
  .source { font-size: 9px; letter-spacing: 1px; opacity: .2; margin: 16px 0 0; padding-top: 12px; border-top: 1px solid rgba(var(--line), .1); font-family: "Songti SC", "STSong", serif; line-height: 1.8; }
  .slider { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px; color: rgba(var(--fg), .55); }
  .slider label { width: 34px; flex-shrink: 0; }
  .slider input { flex: 1; accent-color: rgba(var(--accent), 1); height: 14px; }
  .slider output { width: 46px; text-align: right; font-family: -apple-system, sans-serif; font-size: 10px; opacity: .65; font-variant-numeric: tabular-nums; }
  .switches { display: flex; gap: 12px; margin-top: 12px; font-size: 10px; letter-spacing: 1px; color: rgba(var(--fg), .55); flex-wrap: wrap; }
  .switches label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .switches input { accent-color: rgba(var(--accent), 1); }
  .panel .row { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; padding: 8px 4px; border-radius: 7px; border: 1px solid rgba(var(--line), .2); background: transparent; color: rgba(var(--fg), .75); font-size: 10px; letter-spacing: 1px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: rgba(var(--glow), .55); }
  pre { display: none; margin: 14px 0 0; padding: 12px; border-radius: 7px; background: rgba(0,0,0,.32); border: 1px solid rgba(var(--line), .12); color: rgba(var(--fg), .82); font-size: 9px; line-height: 1.6; overflow-x: auto; white-space: pre; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0; }
  pre.show { display: block; }
  @media (max-height: 620px) {
    .header { top: calc(16px + var(--sat)); }
    .title { margin-bottom: 8px; }
    .notes { gap: 22px; }
    #melody { margin-top: 4px; }
    .motto { display: none; }
    .notes .bar { height: 16px; }
  }
  /* 手机窄屏：底部改成两行制 —— 景/调沉到最底一行，
     提示语整行放宽居中、上移让开，不再和左右角标挤在一层；
     键盘快捷键只在有键盘的设备上出现 */
  @media (max-width: 560px) {
    .header { top: calc(24px + var(--sat)); }
    .footer { left: 24px; right: 24px; bottom: calc(64px + var(--sab)); }
    .footer .hint { font-size: 11px; letter-spacing: 4px; }
    .footer .sub { font-size: 9px; letter-spacing: 0; margin-top: 7px; }
    .kbd { display: none; }
    .corner { bottom: calc(30px + var(--sab)); font-size: 10.5px; }
    .corner.left { left: 24px; }
    .corner.right { right: 24px; }
    .panel { left: 18px; right: 18px; width: auto; bottom: calc(64px + var(--sab)); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="water"></canvas>
  <canvas id="ink"></canvas>
  <div class="vignette"></div>
  <div class="header">
    <div class="title"><span id="appName">叩 音</span><span class="tally" id="tally" aria-label="总敲击次数"><i>·</i><span id="tallyNum">0</span></span></div>
    <div class="notes" id="notes">
      <span>宫<canvas width="40" height="40"></canvas><i class="bar"><b></b></i><em>0</em></span>
      <span>商<canvas width="40" height="40"></canvas><i class="bar"><b></b></i><em>0</em></span>
      <span>角<canvas width="40" height="40"></canvas><i class="bar"><b></b></i><em>0</em></span>
      <span>徵<canvas width="40" height="40"></canvas><i class="bar"><b></b></i><em>0</em></span>
      <span>羽<canvas width="40" height="40"></canvas><i class="bar"><b></b></i><em>0</em></span>
    </div>
    <canvas id="melody" width="500" height="52"></canvas>
    <div class="motto" id="motto">澄 明 · 一 句 有 一 句 的 走 向</div>
  </div>
  <div class="footer">
    <div class="hint" id="hint">轻 触 水 面 · 连 敲 成 句</div>
    <div class="sub">落点定远近 · 按住蓄长韵 · 静下来水会回想<span class="kbd"> · B 换景 / M 换心境</span></div>
  </div>
  <div class="corner left" id="sceneSwitch">景 · 墨池</div>
  <div class="corner right" id="tuneBtn"><span id="tuneOpen">调</span><i class="sep"> · </i><span id="tuneMood" title="点击切换心境">澄明</span></div>
  <div class="panel" id="panel">
    <h2>心 境 <small>曲调走向</small></h2>
    <div class="chips" id="moodChips">
      <button class="chip on" data-mood="chengming">澄明</button>
      <button class="chip" data-mood="youyuan">悠远</button>
      <button class="chip" data-mood="qingyang">轻扬</button>
      <button class="chip" data-mood="yousi">幽思</button>
    </div>
    <div class="legend" id="moodDesc">级进为主，中音区，句句收得住</div>

    <h2>景 <small>背景与光</small></h2>
    <div class="chips small" id="backdropChips">
      <button class="chip on" data-bd="mochi">墨池</button>
      <button class="chip" data-bd="xingtan">星潭</button>
      <button class="chip" data-bd="xuanzhi">宣纸</button>
      <button class="chip" data-bd="yuyue">雨夜</button>
      <button class="chip" data-bd="songwu">松雾</button>
    </div>
    <div class="legend">点左下角「景」或按 B 也能依次换</div>

    <h2>意 境 <small>音色</small></h2>
    <div class="chips" id="chips">
      <button class="chip on" data-scene="kongshan">空山</button>
      <button class="chip" data-scene="qingquan">清泉</button>
      <button class="chip" data-scene="guqing">古磬</button>
      <button class="chip" data-scene="yuexia">月下</button>
    </div>
    <div class="legend">墨符取五行之象 · 宫土 商金 角木 徵火 羽水</div>

    <h2>水 与 声</h2>
    <div class="slider"><label>动静</label><input id="motion" type="range" min="0" max="1" step="0.05" value="0.55"><output id="motionOut"></output></div>
    <div class="slider"><label>余韵</label><input id="decay" type="range" min="0.8" max="4" step="0.1" value="2.9"><output id="decayOut"></output></div>
    <div class="slider"><label>空灵</label><input id="wet" type="range" min="0" max="0.95" step="0.05" value="0.78"><output id="wetOut"></output></div>
    <div class="slider"><label>漫游</label><input id="wander" type="range" min="0" max="1" step="0.05" value="0.28"><output id="wanderOut"></output></div>
    <div class="slider"><label>音区</label><input id="root" type="range" min="100" max="320" step="5" value="140"><output id="rootOut"></output></div>
    <div class="slider"><label>清亮</label><input id="bright" type="range" min="700" max="5200" step="100" value="1700"><output id="brightOut"></output></div>
    <div class="switches">
      <label><input type="checkbox" id="duckToggle" checked> 让位</label>
      <label><input type="checkbox" id="soundToggle" checked> 声</label>
      <label><input type="checkbox" id="echoToggle" checked> 回响</label>
      <label><input type="checkbox" id="airToggle"> 水汽</label>
    </div>
    <div class="row"><button class="btn" id="exportBtn">导出参数</button><button class="btn" id="copyBtn">复制</button></div>
    <pre id="output"></pre>
    <div class="source">课虚无以责有，叩寂寞而求音<br>—— 晋 · 陆机《文赋》</div>
  </div>
</div>

<script>
// 产品名：统一只改这一行。
// 「叩」= watchOS 那一下 .click 轻触，也带叩问之意，叩而有应（水会回想）。
// 出处：陆机《文赋》「课虚无以责有，叩寂寞而求音」——寂里出音，一叩一应。
// 不用「听」：这个 App 的主角是手指与触觉，不是耳朵；声音只是包裹那一叩。
const APP_NAME = '叩音';
const APP_TITLE = APP_NAME + ' · 一池水，一句曲';
document.title = APP_TITLE;
document.getElementById('appName').textContent = APP_NAME.split('').join(' ');

// 三分损益律：宫 商 角 徵 羽 = 1, 9/8, 81/64, 3/2, 27/16
// 跨两个八度，degree 0..9 是「音级」而非按键序号
const RATIOS = [1, 9/8, 81/64, 3/2, 27/16, 2, 9/4, 81/32, 3, 27/8];
const NOTE_NAMES = ['宫', '商', '角', '徵', '羽'];

// 意境 = 音色与水面，不再抢旋律参数
const SCENES = {
  kongshan: { root: 140, decay: 2.9, wet: 0.78, bright: 1700, gain: 0.72, wavelength: 46, waveSpeed: 118 },
  qingquan: { root: 220, decay: 1.7, wet: 0.42, bright: 4200, gain: 0.60, wavelength: 34, waveSpeed: 168 },
  guqing:   { root: 175, decay: 3.5, wet: 0.82, bright: 2600, gain: 0.68, wavelength: 52, waveSpeed: 105 },
  yuexia:   { root: 110, decay: 2.3, wet: 0.68, bright: 1150, gain: 0.52, wavelength: 50, waveSpeed:  92 }
};

// 心境 = 一整套旋律生成规则。随机还是那个「有曲调的随机」，只是性格不同。
const MOODS = {
  chengming: { name: '澄明', desc: '级进为主，中音区，句句收得住',
    wander: 0.28, bias: 0.00, anchor: 5.0, span: 2.0, lenMin: 5, lenMax: 7,
    arch: 0.55, drift: 0.30, ripple: 0.15, link: 0.35, endPull: 1.25, homePull: 0.55, octave: 0.18 },
  youyuan: { name: '悠远', desc: '长句单向，音区开阔，若有若无',
    wander: 0.56, bias: -0.15, anchor: 5.2, span: 3.4, lenMin: 7, lenMax: 9,
    arch: 0.15, drift: 0.62, ripple: 0.23, link: 0.28, endPull: 0.85, homePull: 0.35, octave: 0.30 },
  qingyang: { name: '轻扬', desc: '上行短句，明亮，偶尔小跳',
    wander: 0.46, bias: 0.62, anchor: 6.0, span: 2.5, lenMin: 4, lenMax: 6,
    arch: 0.35, drift: 0.45, ripple: 0.20, link: 0.30, endPull: 1.00, homePull: 0.60, octave: 0.48 },
  yousi: { name: '幽思', desc: '下行低回，浅波起伏，落宫收尾',
    wander: 0.22, bias: -0.60, anchor: 4.0, span: 2.2, lenMin: 6, lenMax: 8,
    arch: 0.20, drift: 0.30, ripple: 0.50, link: 0.42, endPull: 1.55, homePull: 0.70, octave: 0.10 }
};

// 景 = 色板、池底纹理、持续动态元素。shader 与 2D 降级都读这份。
const BACKDROPS = {
  mochi:   { name: '墨池', style: 0, paper: 0, css: '#050709',
             base: [5,7,9],       light: [92,133,120],  caustic: [122,184,168], ink: [40,52,48] },
  xingtan: { name: '星潭', style: 1, paper: 0, css: '#04060e',
             base: [4,6,14],      light: [87,107,184],  caustic: [107,153,235], ink: [36,46,80] },
  xuanzhi: { name: '宣纸', style: 2, paper: 1, css: '#dcd8cc',
             base: [220,216,204], light: [70,80,70],    caustic: [80,92,76],    ink: [70,78,70] },
  yuyue:   { name: '雨夜', style: 3, paper: 0, css: '#050c0e',
             base: [5,12,14],     light: [77,128,133],  caustic: [102,168,173], ink: [38,60,64] },
  songwu:  { name: '松雾', style: 4, paper: 0, css: '#0a0e0b',
             base: [10,14,11],    light: [128,138,102], caustic: [143,168,122], ink: [48,58,42] }
};
const BACKDROP_ORDER = ['mochi', 'xingtan', 'xuanzhi', 'yuyue', 'songwu'];
const MOOD_ORDER = ['chengming', 'youyuan', 'qingyang', 'yousi'];

const DEFAULT_HINT = '轻 触 水 面 · 连 敲 成 句';
const MAX_WAVES = 12;

const stage = document.getElementById('stage');
let waterCanvas = document.getElementById('water');
const inkCanvas = document.getElementById('ink');
const melodyCanvas = document.getElementById('melody');
const gInk = inkCanvas.getContext('2d');
const gMel = melodyCanvas.getContext('2d');
const noteEls = Array.from(document.querySelectorAll('#notes span'));
const barEls = Array.from(document.querySelectorAll('#notes .bar > b'));
const numEls = Array.from(document.querySelectorAll('#notes em'));
const hintEl = document.getElementById('hint');
const output = document.getElementById('output');

let dpr = 1, W = 0, H = 0;
let p = { ...SCENES.kongshan, wander: 0.28, motion: 0.55, mood: 'chengming', backdrop: 'mochi', duckOn: true };
let sceneName = 'kongshan';
let waves = [], marks = [], trails = [], phrase = [], echoes = [], trace = [];
let flash = 0, calm = 0, tapCount = 0, lastTap = 0;
let noteCounts = [0, 0, 0, 0, 0], chainCount = 0;
let duckAt = -10000, duckWeight = 1;
let echoActive = false, echoDone = false, echoOn = true, soundOn = true;
let pressing = false, pressStart = 0, pressPos = { x: 0, y: 0 }, charging = false, lastTrail = 0;
let lastDegree = 5, hintTimer = null;

const isPaper = () => BACKDROPS[p.backdrop].paper === 1;
const inkRGB = () => isPaper() ? '72,84,72' : '170,200,190';
// 色板是 0..255；tint 一律 0..1（shader 与 canvas 共用同一份，避免浅色纸爆亮）
const cssTint = a => a.map(v => Math.round(v * 255)).join(',');
let palFrom = null, palAt = -10000;
function currentPalette(now) {
  const b = BACKDROPS[p.backdrop];
  if (!palFrom) return b;
  const u = Math.min(1, (now - palAt) / 900);
  if (u >= 1) return b;
  const mix = (a, c) => a.map((v, i) => v + (c[i] - v) * u);
  return { ...b,
    base: mix(palFrom.base, b.base), light: mix(palFrom.light, b.light),
    caustic: mix(palFrom.caustic, b.caustic), ink: mix(palFrom.ink, b.ink) };
}

// ---------- 有曲调的随机：加权旋律游走（参数由「心境」给） ----------
// 不是均匀抽样，而是「级进为主 + 乐句轮廓引力 + 句尾落稳定音」。
// 五声音阶没有半音，加上这三层约束，随机走出来仍然成调。
let melody = { degree: 5, pos: 0, len: 6, contour: [], lastStep: 0, repeatRun: 0, lastEnd: 5 };
function newPhrase() {
  const m = MOODS[p.mood];
  // 顶针：偶尔接着上一句最后一个音起句，句与句之间有呼应
  const high = Math.random() < m.octave;
  melody.degree = Math.random() < m.link ? melody.lastEnd
    : high ? 5 + Math.floor(Math.random() * 3) : 2 + Math.floor(Math.random() * 4);
  melody.len = m.lenMin + Math.floor(Math.random() * (m.lenMax - m.lenMin + 1));
  melody.pos = 0; melody.lastStep = 0; melody.repeatRun = 0;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const total = m.arch + m.drift + m.ripple;
  const kind = Math.random() * total;
  melody.contour = [];
  for (let i = 0; i < melody.len; i++) {
    const u = i / (melody.len - 1);
    let v;
    if (kind < m.arch) v = Math.sin(u * Math.PI) * dir;                  // 拱形：先扬后抑
    else if (kind < m.arch + m.drift) v = (1 - 2 * u) * dir;             // 单向：一路走
    else v = 0.35 * Math.sin(u * Math.PI * 1.5) * dir;                   // 浅波
    melody.contour.push(v);

}
function pickDegree() {
  const m = MOODS[p.mood];
  if (melody.pos === 0 || melody.pos >= melody.len) {
    if (melody.pos >= melody.len) melody.lastEnd = melody.degree;
    newPhrase();
  }
  const wander = p.wander;
  const target = m.anchor + melody.contour[melody.pos] * m.span + m.bias * 1.2;
  const last = melody.degree;
  const steps = [-3, -2, -1, 0, 1, 2, 3];
  const weights = steps.map(s => {
    const next = last + s;
    if (next < 0 || next > 9) return 0;
    const a = Math.abs(s);
    let w = a === 0 ? 0.14 : a === 1 ? 1.0 : a === 2 ? (0.18 + wander * 0.30) : (0.02 + wander * 0.12);
    // 朝这一句的轮廓走
    if (s !== 0 && (target - next) * s > 0) w *= 1.55;
    if (melody.pos === melody.len - 1) {
      // 句尾落在宫或徵，收得住；强度随心境
      const pc = next % 5;
      w *= pc === 0 ? 2.6 * m.endPull : pc === 3 ? 1.8 * m.endPull : 0.28;
      if (Math.abs(next - m.anchor) > 3) w *= 0.25;
    } else if (Math.abs(next - m.anchor) > Math.abs(last - m.anchor) && Math.abs(last - m.anchor) >= 2) {
      w *= m.homePull; // 离家太远就往回收，幽思收得最紧
    }
    if (a >= 2 && Math.abs(melody.lastStep) >= 2) w *= 0.18; // 不连续大跳
    if (s === 0) w *= melody.repeatRun > 0 ? 0.15 : 0.5;     // 不连续重复
    return w;

  let r = Math.random() * total, step = 1;
  if (!(total > 0)) { step = last > m.anchor ? -1 : 1; }
  else {
    for (let i = 0; i < steps.length; i++) {
      r -= weights[i];
      if (r <= 0) { step = steps[i]; break; }
    }

  const degree = Math.max(0, Math.min(9, last + step));
  melody.degree = degree;
  melody.lastStep = step;

  melody.pos++;

}
function drawMelody() {
  gMel.setTransform(2, 0, 0, 2, 0, 0);
  gMel.clearRect(0, 0, 250, 26);
  gMel.strokeStyle = 'rgba(' + inkRGB() + ',.10)';
  gMel.lineWidth = 0.6;
  gMel.beginPath(); gMel.moveTo(18, 22); gMel.lineTo(232, 22); gMel.stroke();

  const n = trace.length;
  const pt = i => ({ x: 18 + (n === 1 ? 107 : i * 214 / (n - 1)), y: 22 - trace[i] / 9 * 17 });
  if (n > 1) {
    gMel.beginPath();
    const a = pt(0); gMel.moveTo(a.x, a.y);
    for (let i = 1; i < n; i++) {

    gMel.lineWidth = 0.9;
    gMel.stroke();
  }

  gMel.fillStyle = 'rgba(' + inkRGB() + ',.8)';
  gMel.beginPath(); gMel.arc(c.x, c.y, 1.9, 0, Math.PI * 2); gMel.fill();
}

// 《素问·阴阳应象大论》《汉书·律历志》定五音归属五行；唐·王冰注《素问》
// 又给出五音的性格：宫大而和、商轻而劲、角调而直、徵和而美、羽沉而深。

  voice(noteLP, base, t, decay, peak * 0.55, 0.0026, 1, false, pan);
  voice(noteLP, base * 2, t + 0.02, decay, peak * 0.26, 0, 0.62, true, pan);

    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    const g = ctx.createGain(); g.gain.value = 0.007;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lg = ctx.createGain(); lg.gain.value = 0.003;

// ---------- 一次「落水」：音高同一个数，同时决定水波的长短与冷暖 ----------
function mixTint(t) {
  const c = [0.82 + (0.60 - 0.82) * t, 0.77 + (0.76 - 0.77) * t, 0.67 + (0.84 - 0.67) * t];
  // 宣纸上是淡墨而非发光，但仍是 0..1，shader 与 canvas 才能共用
  return isPaper() ? c.map(v => 0.34 - v * 0.12) : c;
}
function bumpNote(idx, high) {
  noteCounts[idx]++;
  const b = barEls[idx], num = numEls[idx];
  b.style.height = Math.max(3, Math.min(1, noteCounts[idx] / 12) * 24) + 'px';
  b.classList.toggle('cold', high);
  b.classList.add('flash');
  setTimeout(() => b.classList.remove('flash'), 480);
  num.textContent = String(noteCounts[idx]);
  num.style.opacity = '.42';
}
// 总敲击次数只统计用户主动落指，回想与按住长韵不计入
function bumpTotal() {
  const el = document.getElementById('tally');
  document.getElementById('tallyNum').textContent = String(tapCount);
  el.classList.add('pulse');
  clearTimeout(bumpTotal.timer);
  bumpTotal.timer = setTimeout(() => el.classList.remove('pulse'), 520);
}
function emit(x, y, opts) {
  const now = performance.now();
  const degree = opts.degree;
  const idx = degree % 5;
  const isEcho = !!opts.echo;
  const strength = opts.strength;
  const long = !!opts.long;
  const tone = Math.min(1, (degree + (long ? 5 : 0)) / 9);
  const rgb = isEcho ? mixTint(0.92) : mixTint(tone);

  waves.push({
    x, y, t0: now, rgb, strength, degree,
    wavelength: (p.wavelength + (1 - tone) * 26 + p.decay * 3) * (isEcho ? 1.18 : 1) * (long ? 1.35 : 1),
    speed: p.waveSpeed * (0.78 + tone * 0.5) * (isEcho ? 0.62 : 1) * (long ? 0.58 : 1),
    life: (1.5 + p.decay * 0.7) * (isEcho ? 1.15 : 1) * (long ? 1.6 : 1),
    echo: isEcho
  });
  if (waves.length > MAX_WAVES) waves.shift();
  marks.push({ x, y, t0: now, rgb, alpha: isEcho ? 0.35 : 1,
               sentence: !isEcho && !long, degree });
  playNote(degree, strength, x, y, isEcho, long, long);

    if (navigator.vibrate) { try { navigator.vibrate([8 + Math.round(p.gain * 6)]); } catch (e) {} }

    if (!long) bumpNote(idx, degree >= 5);

  // 让位：敲下去的瞬间，环境层主动压低，1.2 秒里慢慢回来
  duckAt = now;
  duckWeight = isEcho ? 0.55 : 1;
  noteEls.forEach((el, i) => {
    el.classList.toggle('on', i === idx && !isEcho);
    el.classList.toggle('echo', i === idx && isEcho);
  });
  clearTimeout(emit.noteTimer);
  emit.noteTimer = setTimeout(() => noteEls.forEach(el => el.classList.remove('on', 'echo')), 2000);
}

// ---------- 水在回想 ----------
function setHint(text) {
  hintEl.style.opacity = '0';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.textContent = text; hintEl.style.opacity = ''; }, 700);
}
function scheduleEcho() {
  echoActive = true;
  const base = performance.now() + 800;
  const t0 = phrase[0].t;
  echoes = phrase.map(e => ({ at: base + (e.t - t0) * 1.18, x: e.x, y: e.y,
                              degree: e.degree, strength: e.strength * 0.45 }));
  echoes.push({ at: echoes[echoes.length - 1].at + 1700, silent: true });
  setHint('水 在 回 想');
}
function userTap(x, y) {
  const now = performance.now();
  const gap = lastTap ? now - lastTap : 0;
  if (echoActive) { echoes = []; echoActive = false; echoDone = true; }
  // 停顿久了只把乐句走向收拢，顶部折线不清空：一直连续，滚动保留最近 10 音
  if (gap > 2200) { melody.pos = melody.len; }
  const degree = pickDegree();
  lastDegree = degree;
  trace.push(degree);
  if (trace.length > 10) trace.shift();
  drawMelody();
  chainCount = gap > 0 && gap < 460 ? Math.min(4, chainCount + 1) : 0;
  const strength = Math.max(0.46, 1 - chainCount * 0.13);

  emit(x, y, { degree, strength, echo: false, long: false });
  phrase.push({ x, y, degree, strength, t: now });
  if (phrase.length > 12) phrase.shift();
  lastTap = now; tapCount++; echoDone = false;
  bumpTotal();
  if (hintEl.textContent !== DEFAULT_HINT) setHint(DEFAULT_HINT);
}
function releaseChord(x, y) {
  emit(x, y, { degree: lastDegree, strength: 0.8, echo: false, long: true });
}

// ---------- 渲染水面 ----------
function drawWaterGL(now, e, duck) {
  const c = glx.c;
  const b = currentPalette(now);
  const list = waves.slice(-MAX_WAVES);
  const n = Math.min(MAX_WAVES, list.length);
  for (let i = 0; i < n; i++) {
    const w = list[i], o = i * 4;
    glx.arrW[o] = w.x; glx.arrW[o+1] = w.y; glx.arrW[o+2] = w.t0 / 1000; glx.arrW[o+3] = w.strength;
    glx.arrM[o] = w.wavelength; glx.arrM[o+1] = w.speed; glx.arrM[o+2] = w.life; glx.arrM[o+3] = 0;
    glx.arrT[o] = w.rgb[0]; glx.arrT[o+1] = w.rgb[1]; glx.arrT[o+2] = w.rgb[2]; glx.arrT[o+3] = w.echo ? 1 : 0;
  }
  c.useProgram(glx.prog);
  c.uniform2f(glx.res, W, H);
  c.uniform2f(glx.moon, W / 2, H / 2);
  c.uniform1f(glx.time, now / 1000);
  c.uniform1f(glx.calm, calm);
  c.uniform1f(glx.flash, flash);
  c.uniform1f(glx.ambient, e);
  c.uniform1f(glx.duck, duck);
  c.uniform1i(glx.count, n);
  c.uniform1i(glx.style, b.style);
  c.uniform3f(glx.base, b.base[0] / 255, b.base[1] / 255, b.base[2] / 255);
  c.uniform3f(glx.lightCol, b.light[0] / 255, b.light[1] / 255, b.light[2] / 255);
  c.uniform3f(glx.causticCol, b.caustic[0] / 255, b.caustic[1] / 255, b.caustic[2] / 255);
  c.uniform4fv(glx.waves, glx.arrW);
  c.uniform4fv(glx.meta, glx.arrM);
  c.uniform4fv(glx.tint, glx.arrT);
  c.drawArrays(c.TRIANGLE_STRIP, 0, 4);
}
function drawWaterFallback(now, e, duck) {
  if (!gWater) return;
  const b = currentPalette(now);
  const t = now / 1000;
  const lv = (1 - calm * 0.72) * (0.55 + e * 0.45);
  const rgb = a => a.map(Math.round).join(',');
  gWater.setTransform(dpr, 0, 0, dpr, 0, 0);
  gWater.fillStyle = 'rgb(' + rgb(b.base) + ')'; gWater.fillRect(0, 0, W, H);
  const mx = W / 2 + Math.sin(t * 0.11) * (10 + e * 22);
  const my = H / 2 + Math.cos(t * 0.085) * (8 + e * 16);
  const breath = 0.5 + 0.5 * Math.sin(t * 0.42);
  const halo = gWater.createRadialGradient(mx, my, 6, mx, my, 210 + breath * 26);
  const lightA = (0.035 + breath * 0.016 + flash * 0.06) * (1 - duck * 0.22) * (b.paper ? 1.5 : 1);
  halo.addColorStop(0, 'rgba(' + rgb(b.light) + ',' + lightA.toFixed(4) + ')');
  halo.addColorStop(1, 'rgba(' + rgb(b.light) + ',0)');
  gWater.globalCompositeOperation = b.paper ? 'multiply' : 'lighter';
  gWater.fillStyle = halo; gWater.fillRect(0, 0, W, H);

  // 持续动画：极缓平移的雾带 / 星点 / 雨纹，都是无起点的整体运动
  if (b.style === 1) {
    for (let i = 0; i < 46; i++) {
      const sx = (i * 137.3) % W, sy = (i * 89.7) % H;
      const tw = 0.45 + 0.55 * Math.sin(t * 0.42 + i);
      gWater.fillStyle = 'rgba(' + rgb(b.caustic) + ',' + (0.10 * tw * (0.35 + e * 0.65)).toFixed(4) + ')';
      gWater.fillRect(sx, sy, 1.2, 1.2);
    }
  } else if (b.style === 3) {
    // 毛玻璃：大团糊斑缓慢漂移（2D 降级里没有真模糊，用大光斑近似磨砂）
    for (let i = 0; i < 4; i++) {
      const fx = W * (0.18 + 0.22 * i) + Math.sin(t * 0.05 + i * 1.9) * 60;
      const fy = H * (0.2 + 0.19 * i) + Math.cos(t * 0.04 + i * 1.3) * 50;
      const fg = gWater.createRadialGradient(fx, fy, 20, fx, fy, 260);
      fg.addColorStop(0, 'rgba(' + rgb(b.light) + ',' + (0.030 * e).toFixed(4) + ')');
      fg.addColorStop(1, 'rgba(' + rgb(b.light) + ',0)');
      gWater.fillStyle = fg; gWater.fillRect(0, 0, W, H);
    }
    // 夜雨落池：灯光倒影拉成竖直光带（在水面上轻轻颤动）
    gWater.save();
    gWater.translate(mx, my + 30);
    gWater.scale(1, 3.2);
    const lg = gWater.createRadialGradient(0, 0, 4, 0, 0, 95);
    const shimmer = 0.66 + 0.34 * Math.sin(t * 1.1);
    lg.addColorStop(0, 'rgba(' + rgb(b.light) + ',' + (0.055 * shimmer * (1 - duck * 0.22)).toFixed(4) + ')');
    lg.addColorStop(1, 'rgba(' + rgb(b.light) + ',0)');
    gWater.fillStyle = lg;
    gWater.fillRect(-110, -110, 220, 220);
    gWater.restore();
    // 稀落的雨丝：极淡的竖直短划
    const pxs2 = W / 390;
    for (let i = 0; i < 9; i++) {
      const rx = (i * 91.7 + 13) % W;
      const sp = 520 + (i * 37 % 10) * 30;
      const ph2 = ((t * sp + i * 231) % (H + 300)) - 150;
      gWater.strokeStyle = 'rgba(' + rgb(b.caustic) + ',' + (0.030 + 0.020 * e).toFixed(4) + ')';
      gWater.lineWidth = 1;
      gWater.beginPath(); gWater.moveTo(rx, ph2); gWater.lineTo(rx, ph2 + 34 * pxs2); gWater.stroke();
    }
    // 雨点落水：约 1.4 秒一滴，落点绽开小涟漪
    const Pr2 = 1.4, slot0 = Math.floor(t / Pr2), fr = x => x - Math.floor(x);
    for (let j = 0; j < 5; j++) {
      const s1 = slot0 - j;
      const sdx = fr(s1 * 0.6180339887 + 0.13), sdy = fr(s1 * 0.3819660113 + 0.31);
      const t0 = (s1 + 0.15 + sdy * 0.7) * Pr2;
      const age = t - t0;
      if (age > 0 && age < 2.2) {
        const rx2 = sdx * W, ry2 = (0.12 + sdy * 0.76) * H;
        const rr2 = age * 90 * pxs2;
        const amp = Math.exp(-age * 2.0) * (1 - j * 0.15);
        gWater.strokeStyle = 'rgba(' + rgb(b.caustic) + ',' + (0.10 * amp * (0.4 + e * 0.6)).toFixed(4) + ')';
        gWater.lineWidth = 1.1;
        gWater.beginPath(); gWater.arc(rx2, ry2, rr2, 0, 6.2832); gWater.stroke();
        if (age < 0.3) {
          const dg = gWater.createRadialGradient(rx2, ry2, 0, rx2, ry2, 8);
          dg.addColorStop(0, 'rgba(' + rgb(b.caustic) + ',' + (0.60 * (0.3 - age) * (0.4 + e * 0.6)).toFixed(4) + ')');
          dg.addColorStop(1, 'rgba(' + rgb(b.caustic) + ',0)');
          gWater.fillStyle = dg; gWater.beginPath(); gWater.arc(rx2, ry2, 8, 0, 6.2832); gWater.fill();
        }
      }
    }
  } else {
    for (let i = 0; i < 3; i++) {
      const fx = W * (0.2 + i * 0.3) + Math.sin(t * 0.09 + i * 2.1) * (18 + e * 46);
      const fy = H * (0.3 + i * 0.22) + Math.cos(t * 0.07 + i) * (10 + e * 22);
      const fg = gWater.createRadialGradient(fx, fy, 10, fx, fy, 220);
      fg.addColorStop(0, 'rgba(' + rgb(b.light) + ',' + (0.020 * e).toFixed(4) + ')');
      fg.addColorStop(1, 'rgba(' + rgb(b.light) + ',0)');
      gWater.fillStyle = fg; gWater.fillRect(0, 0, W, H);
    }
  }

  for (let i = 0; i < 22; i++) {
    const baseY = H * (i + 0.5) / 22;
    gWater.beginPath();
    for (let s = 0; s <= 40; s++) {
      const x = W * s / 40;
      let y = baseY + Math.sin(x * 0.012 + t * 0.24 + i * 0.7) * 3.4 * lv;
      for (const w of waves) {
        const age = (now - w.t0) / 1000;
        const r = Math.hypot(x - w.x, y - w.y);
        const band = (r - age * w.speed) / (42 + w.wavelength * 3);
        const env = Math.exp(-band * band * 1.6) * Math.pow(1 - age / w.life, 1.5) * w.strength;
        y += Math.sin((r - age * w.speed) * 6.283 / w.wavelength) * env * 11;
      }
      if (s === 0) gWater.moveTo(x, y); else gWater.lineTo(x, y);
    }
    gWater.strokeStyle = 'rgba(' + rgb(b.ink) + ',' + (0.020 * lv + 0.010).toFixed(4) + ')';
    gWater.lineWidth = 1; gWater.stroke();
  }
  for (const w of waves) {
    const age = (now - w.t0) / 1000;
    const q = Math.min(1, age / w.life);
    const rr = 26 + age * 60;
    const ig = gWater.createRadialGradient(w.x, w.y, 0, w.x, w.y, rr);
    const col = cssTint(w.rgb);
    ig.addColorStop(0, 'rgba(' + col + ',' + (0.09 * (1 - q) * w.strength).toFixed(4) + ')');
    ig.addColorStop(1, 'rgba(' + col + ',0)');
    gWater.fillStyle = ig;
    gWater.beginPath(); gWater.arc(w.x, w.y, rr, 0, Math.PI * 2); gWater.fill();
  }
  gWater.globalCompositeOperation = 'source-over';
}

// ---------- 覆盖层：墨符、句子、指痕、蓄力 ----------
function drawInk(now) {
  gInk.setTransform(dpr, 0, 0, dpr, 0, 0);
  gInk.clearRect(0, 0, W, H);
  const line = inkRGB();

  trails = trails.filter(t => now - t.t0 < 1400);
  for (const t of trails) {
    const a = (1 - (now - t.t0) / 1400) * 0.10;
    gInk.fillStyle = 'rgba(' + line + ',' + a.toFixed(4) + ')';
    gInk.beginPath(); gInk.arc(t.x, t.y, t.press ? 2.4 : 1.4, 0, Math.PI * 2); gInk.fill();
  }

  const sentence = marks.filter(m => m.sentence);
  if (sentence.length > 1) {
    gInk.beginPath();
    sentence.forEach((m, i) => { if (i === 0) gInk.moveTo(m.x, m.y); else gInk.lineTo(m.x, m.y); });
    gInk.strokeStyle = 'rgba(' + line + ',0.045)';
    gInk.lineWidth = 0.6; gInk.stroke();
  }

  marks = marks.filter(m => now - m.t0 < 3000);
  for (const m of marks) {
    const age = (now - m.t0) / 1000;
    const a = Math.sin(Math.min(1, age / 3) * Math.PI) * 0.46 * m.alpha;
    if (a <= 0) continue;
    // 低音墨符更厚重、高音更轻灵；高八度在符号上方多一枚小点
    const s = 8.6 + (1 - m.degree / 9) * 2.6;
    drawGlyph(gInk, m.degree % 5, m.x, m.y - 20 - age * 11, s,
              cssTint(m.rgb), a, m.degree >= 5);
  }

  if (charging) {
    const hold = Math.min(1, (now - pressStart - 400) / 1400);
    const rr = 22 + hold * 70;
    const ig = gInk.createRadialGradient(pressPos.x, pressPos.y, rr * 0.15, pressPos.x, pressPos.y, rr);
    ig.addColorStop(0, 'rgba(' + line + ',0)');
    ig.addColorStop(0.72, 'rgba(' + line + ',' + (0.02 + hold * 0.05).toFixed(4) + ')');
    ig.addColorStop(1, 'rgba(' + line + ',0)');
    gInk.fillStyle = ig;
    gInk.beginPath(); gInk.arc(pressPos.x, pressPos.y, rr, 0, Math.PI * 2); gInk.fill();
  }
}

function draw(now) {
  const silent = (now - lastTap) / 1000;
  calm = Math.min(1, Math.max(0, (silent - 1.5) / 7));
  if (pressing && now - pressStart > 400) charging = true;

  const dAge = (now - duckAt) / 1200;
  const duck = (p.duckOn && dAge >= 0 && dAge < 1) ? Math.pow(1 - dAge, 1.5) * duckWeight : 0;
  const e = p.motion * (1 - duck * 0.62);

  while (echoActive && echoes.length && now >= echoes[0].at) {
    const e2 = echoes.shift();
    if (!e2.silent) emit(e2.x, e2.y, { degree: e2.degree, strength: e2.strength, echo: true, long: false });
  }
  if (echoActive && echoes.length === 0) {
    echoActive = false; echoDone = true; phrase = [];
    setHint('归 于 静');
    setTimeout(() => { if (!echoActive && performance.now() - lastTap > 4000) setHint(DEFAULT_HINT); }, 3200);
  }

  waves = waves.filter(w => now - w.t0 < w.life * 1000);
  if (glx) drawWaterGL(now, e, duck); else drawWaterFallback(now, e, duck);
  drawInk(now);
  flash *= 0.93;

  if (echoOn && !echoActive && !echoDone && phrase.length >= 2 && silent > 3.2) scheduleEcho();
  requestAnimationFrame(draw);
}

// ---------- 参数与切换 ----------
const ids = ['motion', 'decay', 'wet', 'wander', 'root', 'bright'];
function readSliders() {
  ids.forEach(id => {
    p[id] = parseFloat(document.getElementById(id).value);
    document.getElementById(id + 'Out').textContent =
      id === 'decay' ? p[id].toFixed(1) + 's'
      : id === 'wet' || id === 'wander' || id === 'motion' ? Math.round(p[id] * 100) + '%'
      : Math.round(p[id]) + (id === 'root' ? 'Hz' : '');
  });
  const s = SCENES[sceneName];
  p.gain = s.gain; p.wavelength = s.wavelength; p.waveSpeed = s.waveSpeed;
}
function applyScene(name) {
  sceneName = name;
  ['decay', 'wet', 'root', 'bright'].forEach(id => { document.getElementById(id).value = SCENES[name][id]; });
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.scene === name));
  readSliders();
}
function applyMood(name) {
  p.mood = name;
  const m = MOODS[name];
  document.getElementById('wander').value = m.wander;
  document.querySelectorAll('#moodChips .chip').forEach(c => c.classList.toggle('on', c.dataset.mood === name));
  document.getElementById('moodDesc').textContent = m.desc;
  document.getElementById('tuneMood').textContent = m.name;   // 右下角「调 · 心境」，与「景 · 墨池」一致
  document.getElementById('motto').textContent = m.name.split('').join(' ') + ' · 一 句 有 一 句 的 走 向';
  readSliders();
  melody.pos = melody.len; drawMelody();   // 换心境只收拢走向，折线保留：曲线一直连续
}
function applyBackdrop(name) {
  if (p.backdrop !== name) { palFrom = BACKDROPS[p.backdrop]; palAt = performance.now(); }
  p.backdrop = name;
  const b = BACKDROPS[name];
  document.body.style.background = b.css;
  document.body.classList.toggle('paper', !!b.paper);
  document.querySelectorAll('#backdropChips .chip').forEach(c => c.classList.toggle('on', c.dataset.bd === name));
  document.getElementById('sceneSwitch').textContent = '景 · ' + b.name;
  drawGlyphStrip();
  drawMelody();
}
function cycle(list, current) { return list[(list.indexOf(current) + 1) % list.length]; }

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) applyScene(b.dataset.scene);
});
document.getElementById('moodChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) applyMood(b.dataset.mood);
});
document.getElementById('backdropChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) applyBackdrop(b.dataset.bd);
});
document.getElementById('sceneSwitch').addEventListener('click', () => applyBackdrop(cycle(BACKDROP_ORDER, p.backdrop)));
ids.forEach(id => document.getElementById(id).addEventListener('input', readSliders));
document.getElementById('duckToggle').addEventListener('change', e => { p.duckOn = e.target.checked; });
document.getElementById('soundToggle').addEventListener('change', e => { soundOn = e.target.checked; });
document.getElementById('echoToggle').addEventListener('change', e => {
  echoOn = e.target.checked;
  if (!echoOn) { echoes = []; echoActive = false; }
});
document.getElementById('airToggle').addEventListener('change', e => setAmbience(e.target.checked));

function exportText() {
  const m = MOODS[p.mood];
  return [
    '// ' + APP_TITLE + ' · 墨符：宫土 商金 角木 徵火 羽水',
    'let preset = SoftTapPreset(',
    '    haptic: .click,',
    '    minInterval: 0.22,',
    '    rootHz: ' + p.root.toFixed(0) + ',',
    '    pentatonic: [1, 1.125, 1.265625, 1.5, 1.6875, 2, 2.25, 2.53125, 3, 3.375],',
    '    melodyWander: ' + p.wander.toFixed(2) + ',',
    '    melodyBias: ' + m.bias.toFixed(2) + ',',
    '    melodyAnchor: ' + m.anchor.toFixed(1) + ',',
    '    melodySpan: ' + m.span.toFixed(1) + ',',
    '    phraseMin: ' + m.lenMin + ',',
    '    phraseMax: ' + m.lenMax + ',',
    '    mood: .' + p.mood + ',',
    '    backdrop: .' + p.backdrop + ',',
    '    ambientMotion: ' + p.motion.toFixed(2) + ',',
    '    duckOnTap: ' + (p.duckOn ? 'true' : 'false') + ',',
    '    glyphStyle: .wuxing,',
    '    audioDecay: ' + p.decay.toFixed(2) + ',',
    '    lowpassHz: ' + Math.round(p.bright) + ',',
    '    reverbMix: ' + p.wet.toFixed(2) + ',',
    '    gain: ' + p.gain.toFixed(2) + ',',
    '    jitter: 0.02,',
    '    easeOut: ' + (0.7 + p.decay * 0.28).toFixed(2) + ',',
    '    waveWavelength: ' + p.wavelength.toFixed(0) + ',',
    '    waveSpeed: ' + p.waveSpeed.toFixed(0) + ',',
    '    fieldLines: 22,',
    '    echoDelay: 3.2,',
    '    spatialAudio: true,',
    '    octaveOnHold: true',
    ')'
  ].join('\n');
}
document.getElementById('exportBtn').addEventListener('click', () => { output.textContent = exportText(); output.classList.add('show'); });
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = exportText(); output.textContent = text; output.classList.add('show');
  try { await navigator.clipboard.writeText(text); } catch (e) {}
});

// ---------- 交互 ----------
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.panel, #tuneBtn, #sceneSwitch')) return;
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  pressing = true; pressStart = performance.now(); pressPos = { x, y }; charging = false;
  userTap(x, y);
});
stage.addEventListener('pointermove', e => {
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const now = performance.now();
  if (now - pressStart > 400) charging = pressing;
  if (now - lastTrail > 55) { trails.push({ x, y, t0: now, press: pressing }); lastTrail = now; }
});
function endPress() {
  if (!pressing) return;
  const wasCharging = charging;
  pressing = false; charging = false;
  if (wasCharging) releaseChord(pressPos.x, pressPos.y);
}
window.addEventListener('pointerup', endPress);
window.addEventListener('pointercancel', endPress);
document.getElementById('tuneBtn').addEventListener('click', e => {
  if (e.target.closest('#tuneMood')) return;   // 心境名那一段自己处理，不弹面板
  document.getElementById('panel').classList.toggle('show');
});
document.getElementById('tuneMood').addEventListener('click', e => {
  e.stopPropagation();
  applyMood(cycle(MOOD_ORDER, p.mood));         // 和左下「景」一样，点一下换一个
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    pressing = true; pressStart = performance.now(); pressPos = { x: W / 2, y: H / 2 }; charging = false;
    userTap(W / 2, H / 2);
  }
  if (e.code === 'Escape') document.getElementById('panel').classList.remove('show');
  if (e.code === 'KeyB') applyBackdrop(cycle(BACKDROP_ORDER, p.backdrop));
  if (e.code === 'KeyM') applyMood(cycle(MOOD_ORDER, p.mood));
});
document.addEventListener('keyup', e => { if (e.code === 'Space') endPress(); });

// ---------- 初始化 ----------
applyScene('kongshan');
applyMood('chengming');
applyBackdrop('mochi');
drawMelody();
requestAnimationFrame(draw);

// ---------- 与原生 iOS 的约定接口 ----------
// 原生只用到三件事：① 回前台时把音频上下文/会话重新拉起来；
// ② 退后台前存一份状态；③ WebView 被系统回收重载后把状态放回去。
// 单独放一个命名空间，不污染页面已有的全局函数。
window.__koushui = {
  // 回前台：iOS 会把 AudioContext 置为 interrupted，只有主动 resume 才恢复
  resumeAudio: function () {
    if (!ctx) return false;
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
    return ctx.state === 'running';
  },
  stateJSON: function () {
    return JSON.stringify({
      v: 1,
      count: tapCount,
      notes: noteCounts.slice(0, 5),
      backdrop: p.backdrop,
      mood: p.mood,
      scene: sceneName,
      sound: soundOn,
      echo: echoOn,
      duck: p.duckOn
    });
  },
  restore: function (json) {
    let s = null;
    try { s = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return false; }
    if (!s || typeof s !== 'object') return false;
    if (s.scene && SCENES[s.scene]) applyScene(s.scene);
    if (s.mood && MOODS[s.mood]) applyMood(s.mood);
    if (s.backdrop && BACKDROPS[s.backdrop]) applyBackdrop(s.backdrop);
    if (typeof s.sound === 'boolean') { soundOn = s.sound; document.getElementById('soundToggle').checked = s.sound; }
    if (typeof s.echo === 'boolean') { echoOn = s.echo; document.getElementById('echoToggle').checked = s.echo; }
    if (typeof s.duck === 'boolean') { p.duckOn = s.duck; document.getElementById('duckToggle').checked = s.duck; }
    if (s.notes && s.notes.length === 5) {
      noteCounts = s.notes.slice(0, 5).map(function (n) { return Math.max(0, Math.round(Number(n) || 0)); });
      barEls.forEach(function (b, i) {
        b.style.height = Math.max(3, Math.min(1, noteCounts[i] / 12) * 24) + 'px';
      });
      numEls.forEach(function (n, i) { n.textContent = String(noteCounts[i]); });
    }
    // 总次数最后写：它和五音柱之和必须对得上，否则「·N」会显得凭空多出来
    if (typeof s.count === 'number' && s.count >= 0) { tapCount = Math.round(s.count); bumpTotal(); }
    return true;
  }
};

// 从主屏切回来（没被回收的情况）也会触发：顺手把音频拉起来，第一下就有声
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) window.__koushui.resumeAudio();
});
